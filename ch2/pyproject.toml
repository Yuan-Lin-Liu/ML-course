[project]
name = "fundus-classification"
version = "0.1.0"
description = "Reproducible binary fundus classification with GPU PyTorch"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0+cu126",
    "torchvision==0.23.0+cu126",
    "numpy==2.2.6",
    "pillow==12.0.0",
    "matplotlib==3.10.7",
    "scikit-learn==1.7.2",
]

[tool.uv]
package = false
cache-dir = ".cache/uv"
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
